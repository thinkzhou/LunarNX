name: Build Nintendo Switch application

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional vMAJOR.MINOR.PATCH tag to publish after a successful build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: switch-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  host-input-tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out LunarNX
        uses: actions/checkout@v5

      - name: Prepare legacy libpeer source
        run: ./scripts/setup_dependencies.sh

      - name: Build host WebRTC test libraries
        run: |
          cmake -S lib/libpeer/third_party/mbedtls \
            -B lib/libpeer/third_party/mbedtls/build_host \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build lib/libpeer/third_party/mbedtls/build_host -j3
          cmake -S lib/libpeer/third_party/libsrtp \
            -B lib/libpeer/third_party/libsrtp/build_host \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF -DTEST_APPS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build lib/libpeer/third_party/libsrtp/build_host -j3

      - name: Run Xbox input state-machine tests
        run: |
          make -f Makefile.desktop input_tests
          make -f Makefile.desktop xbox_input_accumulator_tests
          make -f Makefile.desktop outbound_queue_tests
          make -f Makefile.desktop stream_resilience_tests
          make -f Makefile.desktop video_jitter_tests
          make -f Makefile.desktop http_client_cancel_tests
          make -f Makefile.desktop auth_refresh_cancel_tests
          make -f Makefile.desktop network_worker_shutdown_tests

  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20251117
    timeout-minutes: 60
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Check out LunarNX
        uses: actions/checkout@v5

      - name: Trust the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select application version
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG_INPUT"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ -n "$release_tag" ]]; then
            version="$(
              RELEASE_TAG="$release_tag" \
                GIT_COMMIT_SHA="$GITHUB_SHA" \
                bash ./scripts/resolve_app_version.sh
            )"
          else
            version="$(GIT_COMMIT_SHA="$GITHUB_SHA" bash ./scripts/resolve_app_version.sh)"
          fi

          artifact_name="LunarNX-${version}-${GITHUB_SHA}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "app_version=$version"
            echo "artifact_name=$artifact_name"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare pinned source dependencies
        run: |
          ./scripts/setup_dependencies.sh
          ./scripts/setup_chiaki_dependencies.sh

      - name: Build Chiaki libraries
        run: ./tools/chiaki_switch/build_in_container.sh

      - name: Build LunarNX
        env:
          CURL_PROVIDER: moonlight
        run: ./scripts/build_switch_in_container.sh

      - name: Run build regressions
        run: |
          python3 tests/xbox_stream_session_order_test.py
          python3 tests/xbox_stream_exit_cancellation_test.py
          python3 tests/ui_lifecycle_shutdown_test.py
          python3 tests/libpeer_sctp_config_test.py
          python3 tests/libpeer_video_jitter_test.py
          python3 tests/libpeer_dtls_read_loop_test.py
          python3 tests/datachannel_ppid_test.py
          python3 tests/audio_player_reset_test.py
          python3 tests/switch_nro_bss_test.py
          python3 tests/github_actions_switch_build_test.py
          python3 tests/bounded_video_queue_policy_test.py
          python3 tests/changelog_resource_test.py
          python3 tests/chiaki_pmull_runtime_test.py
          python3 tests/media_pipeline_async_test.py
          python3 tests/media_pipeline_scheduling_test.py
          python3 tests/ps_bounded_video_queue_test.py
          python3 tests/ps_high_bitrate_contract_test.py
          python3 tests/ps_media_queue_simulation_test.py
          python3 tests/github_release_workflow_test.py
          git diff --check

      - name: Package build artifact
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/LunarNX"
          mkdir -p "$artifact_dir/licenses"
          cp build/switch/LunarNX.nro "$artifact_dir/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$artifact_dir/"
          cp LICENSES/AGPL-3.0.txt "$artifact_dir/licenses/"
          cd "$artifact_dir"
          sha256sum LunarNX.nro > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ runner.temp }}/LunarNX
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [host-input-tests, build-switch]
    if: ${{ needs.build-switch.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download packaged Switch build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-switch.outputs.artifact_name }}
          path: ${{ runner.temp }}/release/LunarNX

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          release_root="$RUNNER_TEMP/release"
          package_dir="$release_root/LunarNX"
          test -f "$package_dir/LunarNX.nro"
          test -f "$package_dir/LICENSE"
          test -f "$package_dir/THIRD_PARTY_NOTICES.md"
          test -f "$package_dir/licenses/AGPL-3.0.txt"

          cp "$package_dir/LunarNX.nro" "$release_root/LunarNX.nro"
          (
            cd "$release_root"
            zip -qr "LunarNX.zip" "LunarNX"
            sha256sum \
              "LunarNX.nro" \
              "LunarNX.zip" > SHA256SUMS
          )

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-switch.outputs.release_tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "LunarNX $RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/LunarNX.nro" \
            "$RUNNER_TEMP/release/LunarNX.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --clobber
